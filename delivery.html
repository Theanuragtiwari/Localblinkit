
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery</title><link rel="stylesheet" href="style.css"></head><body><header><b>Delivery Partner</b><a href="login.html">Logout</a></header><main><h1>Deliveries</h1><div id="orders"></div></main><script>const API="http://127.0.0.1:8000",h={Authorization:"Bearer "+localStorage.token};async function load(){let raw=await(await fetch(API+"/delivery/orders",{headers:h})).json();let d=raw.data||[];orders.innerHTML=d.map(o=>`<div class=card><h3>#${o.id}</h3><p>${o.address}</p><b>${o.status}</b><p><button onclick="accept(${o.id})">Accept</button> <button onclick="done(${o.id})">Delivered</button> <button onclick="gps(${o.id})">Share GPS</button></p></div>`).join("")}async function accept(id){await fetch(`${API}/delivery/orders/${id}/accept`,{method:"POST",headers:h});load()}async function done(id){await fetch(`${API}/delivery/orders/${id}/delivered`,{method:"POST",headers:h});load()}function gps(id){navigator.geolocation.getCurrentPosition(async p=>{await fetch(API+"/delivery/location",{method:"POST",headers:{...h,"Content-Type":"application/json"},body:JSON.stringify({order_id:id,lat:p.coords.latitude,lng:p.coords.longitude})});alert("GPS sent")})}load()</script></body></html>
