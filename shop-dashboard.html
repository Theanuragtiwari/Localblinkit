
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><b>Shop Dashboard</b><a href="login.html">Logout</a></header><main><h1>Incoming orders</h1><div id="orders"></div><h2>Add product</h2><div class=card><input id=n class=search placeholder="Product name"><input id=p class=search type=number placeholder="Price"><input id=s class=search type=number placeholder="Stock"><button onclick=add()>Add product</button></div></main><script>const API="http://127.0.0.1:8000",h={Authorization:"Bearer "+localStorage.token};async function load(){let raw=await(await fetch(API+"/shop/orders",{headers:h})).json();let d=raw.data||[];orders.innerHTML=d.map(o=>`<div class=card><h3>#${o.id} — ₹${o.total}</h3><p>${o.status}</p><button onclick="st(${o.id},'ACCEPTED')">Accept</button> <button onclick="st(${o.id},'PACKED')">Packed</button></div>`).join("")}async function st(id,x){await fetch(`${API}/shop/orders/${id}/status?status=${x}`,{method:"POST",headers:h});load()}async function add(){await fetch(API+"/shop/products",{method:"POST",headers:{...h,"Content-Type":"application/json"},body:JSON.stringify({name:n.value,price:+p.value,stock:+s.value})});alert("Added")}load()</script></body></html>
