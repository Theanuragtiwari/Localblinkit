services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: localquick
      POSTGRES_USER: localquick
      POSTGRES_PASSWORD: localquick
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      DATABASE_URL: ******db:5432/localquick
      JWT_SECRET: change-this-in-production
      JWT_EXPIRE_MINUTES: 60
      JWT_REFRESH_EXPIRE_MINUTES: 20160
      DELIVERY_RADIUS_KM: 5
      CORS_ORIGINS: "*"
      RATE_LIMIT_PER_MINUTE: 120
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      GOOGLE_MAPS_API_KEY: ""
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  web:
    image: python:3.12-slim
    working_dir: /app
    command: python -m http.server 5500 --bind 0.0.0.0
    volumes:
      - ./:/app
    ports:
      - "5500:5500"

volumes:
  pgdata:
