
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="index.html">← LocalQuick</a><a href="login.html">Login</a></header><main><div id="shop"></div><div class="cart"><h2>Cart</h2><div id="cart">Empty</div><hr><h2>₹<span id="total">0</span></h2><input id="address" class="search" placeholder="Delivery address"><select id="payment" class="search"><option value="COD">Cash on Delivery</option><option value="ONLINE">Online payment (demo)</option></select><button onclick="checkout()">Place order</button><p id="msg"></p></div></main>
<script>
const API="http://127.0.0.1:8000";const sid=new URLSearchParams(location.search).get("id");let shop,cartItems=[];
async function load(){let r=await(await fetch(`${API}/shops/${sid}`)).json();shop=r.data||r;document.querySelector("#shop").innerHTML=`<div class=hero><h1>${shop.name}</h1><p>${shop.area} · ₹${shop.delivery_fee} delivery</p></div><div class=grid>${shop.products.map(p=>`<div class=card><h3>${p.name}</h3><small>${p.category}</small><h3>₹${p.price}</h3><button onclick='add(${JSON.stringify(p)})'>Add</button></div>`).join("")}</div>`}
function add(p){let x=cartItems.find(a=>a.product_id===p.id);if(x)x.quantity++;else cartItems.push({product_id:p.id,quantity:1,name:p.name,price:p.price});render()}
function render(){document.querySelector("#cart").innerHTML=cartItems.map(x=>`<p>${x.name} × ${x.quantity} — ₹${x.price*x.quantity}</p>`).join("")||"Empty";total.textContent=cartItems.reduce((a,x)=>a+x.price*x.quantity,0)}
async function checkout(){const t=localStorage.token;if(!t)return alert("Login first");if(!address.value||!cartItems.length)return alert("Add products and address");let pos=null;try{pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej))}catch(e){}let lat=pos?.coords.latitude||23.2599,lng=pos?.coords.longitude||77.4126;let r=await fetch(API+"/orders",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({shop_id:+sid,address:address.value,lat,lng,items:cartItems,payment_method:payment.value})});let d=await r.json();let x=d.data||d;msg.textContent=r.ok?`Order #${x.id} placed — ₹${x.total}`:(d.message||d.detail||"Order failed");if(r.ok)location.href="track.html?id="+x.id}
load();
</script></body></html>
