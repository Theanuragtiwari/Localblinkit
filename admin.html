
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body><header><b>LocalQuick Admin</b><a href="login.html">Logout</a></header><main><h1>Overview</h1><div id="stats" class=grid></div><h2>Orders</h2><div id="orders"></div></main><script>const API="http://127.0.0.1:8000",h={Authorization:"Bearer "+localStorage.token};async function load(){let r1=await(await fetch(API+"/admin/summary",{headers:h})).json();let s=r1.data||{};stats.innerHTML=Object.entries(s).map(x=>`<div class=card><b>${x[0]}</b><h2>${x[1]}</h2></div>`).join("");let r2=await(await fetch(API+"/admin/orders",{headers:h})).json();let o=r2.data||[];orders.innerHTML=o.map(x=>`<div class=card>#${x.id} · ₹${x.total} · ${x.status} · rider ${x.delivery_id||"—"}</div>`).join("")}load()</script></body></html>
