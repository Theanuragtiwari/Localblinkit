
<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocalQuick</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="index.html">LocalQuick</a><nav><a href="login.html">Login</a><a href="orders.html">Orders</a></nav></header>
<main>
<section class="hero"><span>⚡ LOCAL DELIVERY</span><h1>Groceries from your neighbourhood.</h1><p>Fast essentials from shops near you.</p><button onclick="locate()">📍 Use my location</button></section>
<input id="search" class="search" placeholder="Search nearby stores..." oninput="render()">
<h2>Nearby shops</h2><div id="shops" class="grid"></div>
</main>
<script>
const API="http://127.0.0.1:8000";let shops=[];
async function load(lat,lng){let u=API+"/shops";if(lat)u+=`?lat=${lat}&lng=${lng}`;let res=await (await fetch(u)).json();shops=(res.data||res);render()}
function locate(){navigator.geolocation?.getCurrentPosition(p=>load(p.coords.latitude,p.coords.longitude),()=>load())}
function render(){let q=search.value.toLowerCase();document.querySelector("#shops").innerHTML=shops.filter(s=>s.name.toLowerCase().includes(q)).map(s=>`<a class="card" href="shop.html?id=${s.id}"><div class="icon">🏪</div><h3>${s.name}</h3><p>${s.area}</p><b>₹${s.delivery_fee} delivery</b>${s.distance_km!==null?`<small>${s.distance_km} km away</small>`:""}</a>`).join("")}
load();
</script></body></html>
