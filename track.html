
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track</title><link rel="stylesheet" href="style.css"></head><body><header><a href="orders.html">← Orders</a></header><main><div class="hero"><h1>Track order</h1><h2 id="status">Loading...</h2><p id="payment"></p><p id="gps">Waiting for rider location…</p></div><div id="map" class="map">Live map placeholder — connect Google Maps API key in production.</div></main><script>const id=new URLSearchParams(location.search).get("id"),API="http://127.0.0.1:8000";async function load(){let r=await fetch(`${API}/orders/${id}`,{headers:{Authorization:"Bearer "+localStorage.token}});let d=await r.json();status.textContent=d.status;payment.textContent=`Payment: ${d.payment_status} · Total ₹${d.total}`}load();let ws=new WebSocket(`ws://127.0.0.1:8000/ws/orders/${id}`);ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==="rider_location")gps.textContent=`Rider: ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)} · live`}</script></body></html>
