
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head><body><main><div class="auth"><h1>Welcome back</h1><input id="email" class="search" value="customer@localquick.test"><input id="password" type="password" class="search" value="customer123"><button onclick="login()">Login</button><p id="msg"></p><small>Demo: customer / shop / rider / admin accounts are in README.</small></div></main><script>async function login(){let r=await fetch("http://127.0.0.1:8000/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(!r.ok)return msg.textContent=d.message||d.detail;const payload=d.data||d;localStorage.token=payload.token;localStorage.role=payload.user.role;location.href=payload.user.role==="ADMIN"||payload.user.role==="SUPER_ADMIN"?"admin.html":payload.user.role==="SHOP_OWNER"?"shop-dashboard.html":payload.user.role==="DELIVERY_PARTNER"?"delivery.html":"index.html"}</script></body></html>
