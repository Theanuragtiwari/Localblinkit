
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders</title><link rel="stylesheet" href="style.css"></head><body><header><a href="index.html">← LocalQuick</a></header><main><h1>My orders</h1><div id="orders"></div></main><script>async function load(){let r=await fetch("http://127.0.0.1:8000/orders",{headers:{Authorization:"Bearer "+localStorage.token}});let d=await r.json();orders.innerHTML=d.map(o=>`<a class=card href="track.html?id=${o.id}"><h3>Order #${o.id}</h3><p>₹${o.total} · ${o.status}</p><b>${o.payment_status}</b></a>`).join("")||"<p>No orders</p>"}load()</script></body></html>
